# Website (Next.js) — checks on every pull request and push to main.
# Image build is verified here but NOT pushed; GHCR publishing and VPS
# deployment are added in Phase 15 (docs/backend/02b-cicd-design.md).
name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: web / checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` also runs the TypeScript check with Next.js route types.
      - name: Build (includes type check)
        run: npm run build

      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

  image:
    name: web / image build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          platforms: linux/amd64
          push: false
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.metamaxfashions.com' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
